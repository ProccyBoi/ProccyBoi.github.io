name: Render v3 visual direction studies
on:
  push:
    branches: [v3-visual-studies]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare official browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Capture comparable real browser pixels
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/study-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/v2/ >/dev/null && break; sleep 1; done
          node scripts/capture-v3-visual-studies.cjs
      - name: Save visual comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-visual-direction-studies
          path: /tmp/v3-visual-studies/
          retention-days: 14
