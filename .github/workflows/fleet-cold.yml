name: Fleet cold GPU proof (stage only)
on:
  push:
    branches: [qa/v2-fleet-cold]
permissions:
  contents: read
jobs:
  render:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        width: [390, 1280]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: after
          fetch-depth: 2
      - uses: actions/checkout@v4
        with:
          ref: 4a4c3be11d9ad6a237c5d83a913f1c9d16cbea11
          persist-credentials: false
          path: before
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the isolated browser fixture
        working-directory: ${{ runner.temp }}
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Measure actual browser and GPU completion
        env:
          BASE_SHA: 4a4c3be11d9ad6a237c5d83a913f1c9d16cbea11
          QA_HEAD: ${{ github.sha }}
          WIDTH: ${{ matrix.width }}
          FLEET_RUNS: 3
        run: |
          mkdir -p proof
          printf 'baseline=%s\nqa_head=%s\n' "$BASE_SHA" "$QA_HEAD" > proof/revisions.txt
          git -C after rev-parse HEAD^{tree} >> proof/revisions.txt
          git -C after rev-parse HEAD^ >> proof/revisions.txt
          if [ "$(git -C after rev-parse HEAD^)" = "$BASE_SHA" ]; then export FLEET_RUNS=1; fi
          cp after/scripts/fleet-cold.cjs "$RUNNER_TEMP/fleet-cold.cjs"
          node "$RUNNER_TEMP/fleet-cold.cjs" before after proof "$WIDTH"
      - name: Capture complete desktop and phone animation poses
        if: ${{ !cancelled() && matrix.width == 1280 }}
        env:
          V2_BASE_URL: http://127.0.0.1:8808
          BASE_SHA: 4a4c3be11d9ad6a237c5d83a913f1c9d16cbea11
        run: |
          if [ "$(git -C after rev-parse HEAD^)" = "$BASE_SHA" ]; then exit 0; fi
          export NODE_PATH="$RUNNER_TEMP/node_modules"
          export CHROMIUM_EXECUTABLE="$(node -p "require('playwright').chromium.executablePath()")"
          python3 -m http.server 8808 --bind 127.0.0.1 --directory after &
          listener=$!
          trap 'kill "$listener"' EXIT
          for n in {1..25}; do curl -fsS "$V2_BASE_URL/v2/projects/skylabs/" -o /dev/null && break; sleep .25; done
          cd after
          node scripts/verify-v2-skylabs-fleet.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-cold-${{ matrix.width }}-${{ github.sha }}
          path: |
            proof/
            after/.codex-temp/fleet/
          include-hidden-files: true
          retention-days: 7
