name: Review clearer v2 navigation
on:
  push:
    branches: [v2-navigation-clarity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 scripts/audit-v2.py
          python3 scripts/build-v3-pages.py --check
          python3 scripts/audit-v3.py
          node scripts/verify-v2-navigation-clarity.cjs --source-only
          node scripts/verify-v2-decorative-hero.cjs
          node scripts/verify-v2-decorative-loader.cjs
          node scripts/verify-v2-selected-background.cjs
          node scripts/verify-v2-scroll-smoothing.cjs
          node scripts/verify-v2-gpu-preparation.cjs
          node scripts/verify-v2-hero-pacing.cjs --source-only
          node scripts/verify-v2-aircraft-pacing.cjs --source-only
          node scripts/verify-v2-selected-scene.cjs --source-only
          node scripts/verify-v3-story-controller.cjs
          node scripts/verify-v3-direct-transition.cjs
          node scripts/verify-v3-film-peel.cjs
          node scripts/verify-v3-aircraft-transport.cjs
          python3 scripts/recompress-v2-packs.py --verify
  browser:
    strategy:
      fail-fast: false
      matrix:
        suite: [desktop, mobile390, mobile320, fallbacks, routes, booking]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Real CAD and natural navigation acceptance
        env:
          V2_BASE_URL: http://127.0.0.1:8080
          V2_NAV_OUT: /tmp/v2-navigation
          V2_BOOKING_OUT: /tmp/v2-navigation/booking
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/v2/ >/dev/null && break; sleep 1; done
          if [ '${{ matrix.suite }}' = booking ]; then node scripts/verify-v2-booking.cjs; else node scripts/verify-v2-navigation-clarity.cjs --group=${{ matrix.suite }}; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-navigation-${{ matrix.suite }}
          path: /tmp/v2-navigation
          retention-days: 14
  v3:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Unchanged v3 browser regression
        env:
          V3_BASE_URL: http://127.0.0.1:8080/v3/
          V3_SCREENSHOTS: /tmp/v3-browser-evidence
          V3_SHARD_INDEX: ${{ matrix.shard }}
          V3_SHARD_COUNT: '3'
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/v3-preview.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/v3/ >/dev/null && break; sleep 1; done
          node scripts/verify-v3-portfolio.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-navigation-v3-${{ matrix.shard }}
          path: /tmp/v3-browser-evidence
          retention-days: 14
