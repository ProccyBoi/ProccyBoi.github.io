name: Build lossless v2 Selected Work CAD packs
on:
  push:
    branches: [v2-selected-live-scenes]
    paths:
      - scripts/build-v2-selected-assets.cjs
      - scripts/build-v2-hero-assets.cjs
      - .github/workflows/build-v2-selected-assets.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/v2-selected-live-scenes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official build dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Build, reconstruct and verify all four real assemblies
        env:
          V2_BASE_URL: http://127.0.0.1:8080
          V2_SELECTED_OUT: /tmp/v2-selected-assets/selected
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/v2-selected-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/v2/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/v2/ >/dev/null
          node scripts/build-v2-selected-assets.cjs --check
          node scripts/build-v2-selected-assets.cjs --self-test
          node scripts/build-v2-selected-assets.cjs
          node scripts/build-v2-selected-assets.cjs --verify
          git diff --exit-code -- assets v2
      - name: Save only new Selected Work packs and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-selected-real-cad-packs
          path: /tmp/v2-selected-assets/
          if-no-files-found: error
          retention-days: 14
