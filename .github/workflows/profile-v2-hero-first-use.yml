name: Attribute v2 hero first-use stalls
on:
  push:
    branches: [v2-hero-speed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-hero-first-use-${{ github.ref }}
  cancel-in-progress: false
jobs:
  first-use:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fixed browser and immutable live fixture
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
          git worktree add --detach /tmp/v2-hero-live 5a50d2f336accccaf1577ad43f1465506bdbeb5c
      - name: Validate test-only source deltas and fixture cache policy
        env:
          V2_HERO_FIRST_USE_ROOT: /tmp/v2-hero-live
        run: node scripts/profile-v2-hero-first-use.cjs --source-only
      - name: Measure three modes with three cold and cached pairs each
        env:
          V2_HERO_FIRST_USE_ROOT: /tmp/v2-hero-live
          V2_HERO_FIRST_USE_OUT: /tmp/v2-hero-first-use/profile.json
        run: node scripts/profile-v2-hero-first-use.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-hero-first-use
          path: /tmp/v2-hero-first-use/
          retention-days: 14
