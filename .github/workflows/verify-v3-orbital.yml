name: Verify v3 Orbital and v4 Portfolio
on:
  push:
    branches: [feat/v3-orbital-workshop, fix/portfolio-arrow-compatibility]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v3-orbital-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify authoring, source boundaries and preserved content
        run: |
          python3 scripts/build-v3-pages.py --check
          # Freeze the independently approved v4 tree; only v3/support deltas may differ.
          git diff --exit-code 5ed8c5ef9ecedb0e2bdd2d92931da8d4f1a6af44 HEAD -- v4/ .github/workflows/verify-v4-cinematic.yml
          python3 scripts/v3-webgpu/verify-isolation.py --base 5ed8c5ef9ecedb0e2bdd2d92931da8d4f1a6af44
          python3 v4/tests/static.py
          node --input-type=module --check < v4/assets/site.js
          python3 scripts/audit-v2.py
          node scripts/kiku-simulator/verify.cjs
          node scripts/verify-v3-aircraft-transport.cjs
          node scripts/verify-flight-review-runtime.cjs
          node --input-type=module --check < v3/assets/orbital.js
          node --input-type=module --check < v3/assets/orbital-engine.js
          find v3/assets -name '*.js' -not -path '*/vendor/*' -print0 | xargs -0 -n 1 node --check
  browser:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser and screenshot reader
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps ${{ matrix.engine }}
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
      - name: Check native rendering, fallbacks, responsive controls and screenshots
        env:
          V3_BASE_URL: http://127.0.0.1:8080
          V3_ORBITAL_OUT: /tmp/v3-orbital-evidence
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/v3-orbital-server.log 2>&1 &
          trap 'kill $!' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/v3/ >/dev/null && break; sleep 1; done
          if [ '${{ matrix.engine }}' = chromium ]; then
            xvfb-run -a node scripts/v3-orbital/verify-browser.cjs --require-webgpu
          else
            node scripts/v3-orbital/verify-browser.cjs --webkit
          fi
      - name: Verify the approved v4 portfolio on the same release tree
        env:
          V4_BASE_URL: http://127.0.0.1:8080
          V4_QA_OUT: /tmp/v4-evidence
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/v4-server.log 2>&1 &
          trap 'kill $!' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/v4/ >/dev/null && break; sleep 1; done
          if [ '${{ matrix.engine }}' = webkit ]; then
            node v4/tests/browser.cjs --webkit
          else
            node v4/tests/browser.cjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-v4-release-${{ matrix.engine }}-${{ github.sha }}
          path: |
            /tmp/v3-orbital-evidence/
            /tmp/v3-orbital-server.log
            /tmp/v4-evidence/
            /tmp/v4-server.log
          retention-days: 14
