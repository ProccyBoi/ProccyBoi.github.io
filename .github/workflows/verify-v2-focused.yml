name: Review focused v2 controls and copy
on:
  push:
    branches: [v2-focused-cleanup]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact scope, routes, models and unchanged scene behavior
        run: |
          node scripts/verify-v2-focused.cjs --source-only
          python3 scripts/audit-v2.py
          python3 scripts/build-v3-pages.py --check
          python3 scripts/audit-v3.py
          node scripts/verify-v2-review-browsing.cjs --source-only
          node scripts/verify-v2-hero-prefetch.cjs
          node scripts/verify-v2-scroll-smoothing.cjs
          node scripts/verify-v2-gpu-preparation.cjs
          node scripts/verify-v2-hero-pacing.cjs --source-only
          node scripts/verify-v2-aircraft-pacing.cjs --source-only
          node scripts/verify-v3-product-controls.cjs
          node scripts/verify-v3-product-browser.cjs --self-test
  chromium:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop1440, phone320, phone390, ipad768, ipad820, ipad1024, ipad1180, ipadpro1024]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Real CAD, native controls, accessible routes and responsive focus
        env:
          V2_BASE_URL: http://127.0.0.1:8080
          V2_FOCUSED_OUT: /tmp/v2-focused
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/v2-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/v2/ >/dev/null && break; sleep 1; done
          node scripts/verify-v2-focused.cjs --viewport=${{ matrix.viewport }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-focused-${{ matrix.viewport }}
          path: |
            /tmp/v2-focused/
            /tmp/v2-server.log
          retention-days: 14
  fallbacks:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: No JavaScript, reduced motion, graphics failure and landscape
        env:
          V2_BASE_URL: http://127.0.0.1:8080
          V2_FOCUSED_OUT: /tmp/v2-focused
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/v2-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/v2/ >/dev/null && break; sleep 1; done
          if [ '${{ matrix.engine }}' = webkit ]; then node scripts/verify-v2-focused.cjs --webkit; else node scripts/verify-v2-focused.cjs --fallbacks; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-focused-${{ matrix.engine }}-fallbacks
          path: |
            /tmp/v2-focused/
            /tmp/v2-server.log
          retention-days: 14
