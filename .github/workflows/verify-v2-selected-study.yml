name: Review shared v2 Selected Work scenes
on:
  push:
    branches: [v2-selected-live-scenes, v2-selected-responsive]
    paths-ignore:
      - scripts/build-v2-selected-assets.cjs
      - scripts/build-v2-hero-assets.cjs
      - .github/workflows/build-v2-selected-assets.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selected:
    strategy:
      fail-fast: false
      matrix:
        suite: [study, core, lifecycle, entry, profile, responsiveness, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Source parity and desktop/mobile scene studies
        env:
          V2_BASE_URL: http://127.0.0.1:8080
          V2_SELECTED_OUT: /tmp/v2-selected-study
          V2_BACKGROUND_OUT: /tmp/v2-selected-study/background
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/v2/ >/dev/null && break; sleep 1; done
          case '${{ matrix.suite }}' in
            study) node scripts/verify-v2-selected-scene.cjs --study ;;
            core|lifecycle|entry) node scripts/verify-v2-selected-scene.cjs --group=${{ matrix.suite }} ;;
            assets) V2_SELECTED_OUT=assets/models/selected node scripts/build-v2-selected-assets.cjs --verify && node scripts/build-v2-hero-assets.cjs --verify ;;
            responsiveness)
              git worktree add --detach /tmp/v2-published de2d03d7f98a1b435bd92e6682d081e6194a14b5
              python3 -m http.server 8081 --bind 127.0.0.1 --directory /tmp/v2-published >/tmp/baseline.log 2>&1 &
              for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8081/v2/ >/dev/null && break; sleep 1; done
              V2_BASE_URL=http://127.0.0.1:8081 V2_SELECTED_OUT=/tmp/v2-selected-study/input-baseline node scripts/verify-v2-selected-scene.cjs --responsiveness-only
              V2_SELECTED_OUT=/tmp/v2-selected-study/input-final node scripts/verify-v2-selected-scene.cjs --responsiveness-only
              V2_SELECTED_OUT=/tmp/v2-selected-study/repeat/input-final node scripts/verify-v2-selected-scene.cjs --responsiveness-only
              V2_BASE_URL=http://127.0.0.1:8081 V2_SELECTED_OUT=/tmp/v2-selected-study/repeat/input-baseline node scripts/verify-v2-selected-scene.cjs --responsiveness-only
              ;;
            profile)
              # Matched cold baseline/final runs, then reversed order, on one
              # runner through actual background GPU preparation.
              git worktree add --detach /tmp/v2-published de2d03d7f98a1b435bd92e6682d081e6194a14b5
              python3 -m http.server 8081 --bind 127.0.0.1 --directory /tmp/v2-published >/tmp/baseline.log 2>&1 &
              for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8081/v2/ >/dev/null && break; sleep 1; done
              V2_BASE_URL=http://127.0.0.1:8081 V2_BACKGROUND_OUT=/tmp/v2-selected-study/background-baseline node scripts/verify-v2-background.cjs --profile-only
              node scripts/verify-v2-background.cjs --profile-only
              V2_BACKGROUND_OUT=/tmp/v2-selected-study/repeat/background node scripts/verify-v2-background.cjs --profile-only
              V2_BASE_URL=http://127.0.0.1:8081 V2_BACKGROUND_OUT=/tmp/v2-selected-study/repeat/background-baseline node scripts/verify-v2-background.cjs --profile-only
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-selected-${{ matrix.suite }}
          path: /tmp/v2-selected-study
          retention-days: 14
