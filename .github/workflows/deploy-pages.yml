name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Verify v2 documents and local assets
        run: python3 scripts/audit-v2.py

      - name: Verify v2 loading gates and hero handoffs
        run: |
          node scripts/verify-v2-deferred-loading.cjs
          node scripts/verify-v2-hero-handoffs.cjs
          node scripts/verify-v2-proximity-loading.cjs
          node scripts/verify-v2-hero-pacing.cjs --source-only

      - name: Verify Kiku firmware renderer and simulated controls
        run: node scripts/kiku-simulator/verify.cjs

      - name: Verify isolated v3 copy and preserved interactive content
        run: |
          python3 scripts/build-v3-pages.py --check
          python3 scripts/audit-v3.py --structure-only
          node scripts/verify-v3-aircraft-transport.cjs

      - name: Verify v4 project pages and navigation
        run: |
          python3 v4/tests/static.py
          node --check v4/assets/site.js

      - name: Verify v5 research portfolio and navigation
        run: |
          python3 v5/tests/static.py
          node --check v5/assembly.js
          node --check v5/solder-process.js
          node --check v5/interiors.js

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out deployment helper
        uses: actions/checkout@v7

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v9
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const deploy = require('./.github/scripts/deploy-pages.cjs')
            await deploy({ github, context, core })

      - name: Verify published Flight Review files and preserved redirects
        run: node scripts/flight-review/verify-live.cjs
